<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Генератор Промптов для Рассказов{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>Генератор Промптов для Рассказов</h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="active"{% endif %}>Главная</a></li>
                    <li><a href="{{ url_for('categories_page') }}" {% if request.endpoint == 'categories_page' %}class="active"{% endif %}>Категории</a></li>
                    <li><a href="{{ url_for('subcategories_page') }}" {% if request.endpoint == 'subcategories_page' %}class="active"{% endif %}>Подкатегории</a></li>
                    <li><a href="{{ url_for('character_traits_page') }}" {% if request.endpoint == 'character_traits_page' %}class="active"{% endif %}>Характеристики</a></li>
                    <li><a href="{{ url_for('characters_page') }}" {% if request.endpoint == 'characters_page' %}class="active"{% endif %}>Персонажи</a></li>
                    <li><a href="{{ url_for('locations_page') }}" {% if request.endpoint == 'locations_page' %}class="active"{% endif %}>Локации</a></li>
                    <li><a href="{{ url_for('tones_page') }}" {% if request.endpoint == 'tones_page' %}class="active"{% endif %}>Тоны</a></li>
                    <li><a href="{{ url_for('dialogue_styles_page') }}" {% if request.endpoint == 'dialogue_styles_page' %}class="active"{% endif %}>Стили диалогов</a></li>
                    <li><a href="{{ url_for('generate_page') }}" {% if request.endpoint == 'generate_page' %}class="active"{% endif %}>Генерировать</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
